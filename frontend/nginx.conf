# nginx del frontend.
#
# Sirve el bundle estático y expone un health de liveness propio, de modo que el
# estado del contenedor no dependa de que el backend esté disponible.
#
# Las solicitudes protegidas se reenvían sin caché ni registro de cuerpos.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    client_max_body_size 64m;
    client_body_timeout 420s;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_buffering off;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Cabeceras básicas de endurecimiento. La aplicación eventualmente manejará
    # información jurídica, por lo que conviene no filtrar origen ni permitir
    # interpretación de tipos MIME.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Liveness del propio frontend.
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    # Caché: los archivos de /assets/ llevan una huella de contenido en el nombre y nunca
    # cambian; index.html sí cambia en cada despliegue y debe revalidarse siempre, o el
    # navegador seguiría ejecutando la versión anterior de la aplicación. Un add_header
    # dentro de un location anula los del servidor, por eso se repiten las de endurecimiento.

    # PDF.js carga su worker local como módulo. Con `nosniff`, el tipo genérico
    # application/octet-stream impediría que el navegador lo ejecute.
    location ~ ^/assets/.*\.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        # Fallback de aplicación de página única; el documento se revalida en cada carga.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # No exponer archivos ocultos.
    location ~ /\. {
        deny all;
    }
}
